    <script>
      // 渲染前应用主题（深 / 浅），避免闪烁
      (function() {
        try {
          var t = localStorage.getItem('oscar-theme');
          var resolved;
          if (t === 'light' || t === 'dark') {
            resolved = t;
          } else {
            // system 或未设置：跟随系统
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) { /* ignore */ }
      })();

      // 渲染前应用主页主题（classic / atlas），避免闪烁
      // 默认 atlas（新用户），用户可在 settings 切换并会缓存到 localStorage。
      (function() {
        try {
          var ht = localStorage.getItem('oscar-home-theme');
          if (ht !== 'classic' && ht !== 'atlas') ht = 'atlas';
          document.documentElement.setAttribute('data-home-theme', ht);
        } catch (e) { /* ignore */ }
      })();
    </script>
