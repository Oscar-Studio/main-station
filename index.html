    <script>
      // 渲染前应用主题（深 / 浅），避免闪烁
      (function() {
        try {
          var t = localStorage.getItem('oscar-theme');
          var resolved;
          if (t === 'light' || t === 'dark') {
            resolved = t;
          } else {
            // system 或未设置：跟随系统
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) { /* ignore */ }
      })();

      // The landing page has one design; normalize retired cached preferences.
      document.documentElement.setAttribute('data-home-theme', 'atlas');
      try { localStorage.setItem('oscar-home-theme', 'atlas'); } catch (e) { /* storage may be unavailable */ }
    </script>
